<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 뽑기</title>
  <style>
    /* 노션의 작은 임베드 화면에서도 보기 좋도록 전체를 가운데에 좁게 놓는다 */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #ffffff;
      color: #37352f;
    }
    .widget {
      max-width: 360px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h1 { margin: 0; font-size: 18px; }
    label { font-size: 14px; color: #787774; }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: 10px;
      font-size: 15px;
      line-height: 1.5;
      border: 1px solid #d3d1cb;
      border-radius: 8px;
      resize: vertical;
      font-family: inherit;
    }
    button {
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: #2383e2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #1b6fc2; }
    /* 뽑힌 결과를 크게 보여 주는 칸 */
    .result {
      min-height: 64px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      word-break: break-all;
      background: #f7f6f3;
      border-radius: 8px;
    }
    /* 후보가 없을 때 보여 주는 안내 글은 작고 차분하게 */
    .result.notice {
      font-size: 15px;
      font-weight: 400;
      color: #d44c47;
    }
  </style>
</head>
<body>
  <div class="widget">
    <h1>랜덤 뽑기</h1>
    <label for="candidates">후보를 한 줄에 하나씩 적어 주세요</label>
    <textarea id="candidates" placeholder="짜장면&#10;짬뽕&#10;볶음밥"></textarea>
    <button id="drawButton" type="button">뽑기</button>
    <div id="result" class="result" aria-live="polite"></div>
  </div>

  <script>
    // 화면에서 쓸 요소들을 미리 찾아 둔다
    const candidatesInput = document.getElementById('candidates');
    const drawButton = document.getElementById('drawButton');
    const resultBox = document.getElementById('result');

    // 입력창의 글을 줄 단위로 나눠 후보 목록을 만든다
    function getCandidates() {
      return candidatesInput.value
        .split('\n')                      // 줄바꿈 기준으로 나누고
        .map(function (line) { return line.trim(); }) // 앞뒤 공백을 지운 뒤
        .filter(function (line) { return line !== ''; }); // 빈 줄은 빼 버린다
    }

    // "뽑기" 버튼을 눌렀을 때 실행되는 함수
    function draw() {
      const candidates = getCandidates();

      // 후보가 하나도 없으면 안내만 보여 주고 끝낸다
      if (candidates.length === 0) {
        resultBox.textContent = '후보를 한 줄에 하나씩 입력해 주세요.';
        resultBox.classList.add('notice');
        return;
      }

      // 0 이상 후보 개수 미만의 정수를 무작위로 하나 고른다
      // (후보가 하나뿐이면 항상 0번, 즉 그 후보가 나온다)
      const index = Math.floor(Math.random() * candidates.length);

      resultBox.textContent = candidates[index];
      resultBox.classList.remove('notice');
    }

    drawButton.addEventListener('click', draw);
  </script>
</body>
</html>
